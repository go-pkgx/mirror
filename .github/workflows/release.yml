name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Must already exist."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # ⛔ THE TAG MUST BE REACHABLE, and the default checkout is shallow:
      # it fetches ONE commit of the ref it was given. `git checkout "$tag"`
      # on the dispatch path then fails with
      #
      #     error: pathspec 'v0.3.10' did not match any file(s) known to git
      #
      # Measured 2026-10-09, immediately after adding that checkout — I took
      # `git checkout "$tag"` from go-pkgx/bk and left behind the
      # `fetch-depth: 0` it needs. Half of a pair.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            # ⛔ A DISPATCH CHECKS OUT THE DEFAULT BRANCH, NOT THE TAG.
            # Without this line the run builds whatever main holds and
            # uploads it under the tag's name. Measured 2026-10-09: a
            # re-run of v0.3.10 replaced its assets with binaries stamped
            # `v0.0.0-20261009064454-6f82d049bd0e` — a pseudo-version, which
            # is Go saying "this commit is not a tag".
            git checkout "$tag"
          else
            tag="$REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Cross-compile the pure-Go CGO_ENABLED=0 binary for every
      # {linux,darwin,windows} x {amd64,arm64} target, name the assets
      # mirror-<os>-<arch> (windows: .exe), and record a SHA256SUMS manifest.
      # The release version (tag without the leading "v") is injected into
      # main.version via -ldflags so `mirror --version` matches the tag.
      # ⛔ dist/ MUST NOT LIVE IN THE CHECKOUT. Go stamps the main module
      # from the work tree's VCS state, so the moment the first binary lands
      # in an untracked dist/ the tree is dirty and every LATER build in this
      # loop is stamped `+dirty` with `vcs.modified=true`. Measured on the
      # published v0.3.10 assets: `mod github.com/go-pkgx/mirror v0.3.10+dirty`.
      #
      # An EMPTY directory is invisible to git, so `mkdir dist` alone is
      # harmless — it is the first `-o dist/...` that does it, which means
      # the FIRST target comes out clean and the rest do not. A guard that
      # checked one binary could therefore check the clean one and pass.
      - name: Build release binaries
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          DIST="$RUNNER_TEMP/dist"
          mkdir -p "$DIST"
          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            out="mirror-${os}-${arch}"
            if [ "$os" = "windows" ]; then
              out="${out}.exe"
            fi
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X main.version=${TAG#v}" -o "$DIST/${out}" .
          done
          cd "$DIST"
          sha256sum mirror-* > SHA256SUMS
          cat SHA256SUMS

      # EVERY binary, not one, and EQUALITY, not "contains the tag".
      # `case "$got" in *"$TAG"*` is the spelling that accepts
      # "0.3.10+dirty", which is how this went unnoticed.
      - name: Refuse a dirty or mis-stamped build
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          DIST="$RUNNER_TEMP/dist"
          want="${TAG#v}"
          bad=0
          for bin in "$DIST"/mirror-*; do
            name=$(basename "$bin")
            info=$(go version -m "$bin")
            mod=$(printf '%s\n' "$info" | awk '$1=="mod" {print $3; exit}')
            # ⛔ EQUALITY WITH THE TAG, not merely "not dirty". The first
            # version of this guard only looked for +dirty, and a dispatch
            # that rebuilt main under a tag sailed through it: the binaries
            # were clean, and stamped `v0.0.0-<date>-<sha>` instead of the
            # tag. A pseudo-version is Go saying "this commit is not a tag",
            # which is a different failure the +dirty test cannot see.
            if [ "$mod" != "$TAG" ]; then
              echo "::error::$name stamps $mod but this is $TAG — it was not built from the tag"
              bad=1
            fi
            case "$mod" in
              *+dirty)
                echo "::error::$name: build info says $mod — the work tree was dirty"
                bad=1
                ;;
            esac
            if printf '%s\n' "$info" | grep -q 'vcs\.modified=true'; then
              echo "::error::$name: vcs.modified=true"
              bad=1
            fi
            echo "$name: $mod"
          done
          # And the version it PRINTS: the ldflags stamp is what users see,
          # and it is set independently of the build info above.
          got=$("$DIST/mirror-linux-amd64" --version | awk '{print $2}')
          if [ "$got" != "$want" ]; then
            echo "::error::mirror --version says '$got', want exactly '$want'"
            bad=1
          fi
          exit "$bad"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          DIST="$RUNNER_TEMP/dist"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DIST"/* --clobber
          else
            gh release create "$TAG" "$DIST"/* \
              --title "$TAG" \
              --notes "Static, dependency-free mirror binaries (CGO_ENABLED=0) for linux, darwin and windows on amd64 and arm64. Verify downloads against SHA256SUMS. Install THIS release with: curl -fsSL https://go-pkgx.github.io/install.sh | sh -s -- mirror $TAG"
          fi
